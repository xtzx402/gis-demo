apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-demo-blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gis-demo
      version: blue
  template:
    metadata:
      labels:
        app: gis-demo
        version: blue
    spec:
      containers:
      - name: gis-demo
        image: us-east1-docker.pkg.dev/gis-demo-498621/gis-demo/gis-demo:blue
        ports:
        - containerPort: 8000
        env:
        - name: VERSION
          value: "blue"